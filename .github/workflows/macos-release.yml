name: macOS app and screenshots

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "screenshots/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Capture English and Turkish screenshots
        if: github.ref == 'refs/heads/main'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/capture_screenshots.py
      - name: Commit screenshots to main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$(git status --porcelain screenshots/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add screenshots/ai-photo-en.png screenshots/ai-foto-tr.png
            git commit -m "Add bilingual app screenshots"
            gh auth setup-git
            git push origin HEAD:main
          fi
      - name: Build macOS app and DMG
        run: |
          python -m PyInstaller --noconfirm --clean "AI Photo.spec"
          ./build_dmg.sh
      - name: Publish release DMG
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "dist/AI Foto.dmg" --title "AI Foto ${GITHUB_REF_NAME}" --generate-notes
      - name: Upload build artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ai-foto-macos-dmg
          path: dist/AI Foto.dmg
          if-no-files-found: error
